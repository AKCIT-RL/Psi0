# GR00T N1.7 environment baked into the OVX image at /opt/venvs/gr00t (training + policy server).
#
# Pinned to the environment that trained the carry_totes / screwdrivers / screws specialists
# on the OVX (versions recorded from that venv in 2026-09).
#
# The model code is not installed here: the image copies src/gr00t and puts it on PYTHONPATH.
# Note this DIFFERS from how the repo is normally used -- `uv sync` inside src/gr00t installs
# gr00t editable (src/gr00t/uv.lock records source = { editable = "." }), and that is what
# submit_slurm.sh@f0a2e4e relied on; it sets no PYTHONPATH. Only `psi` comes in by PYTHONPATH
# upstream (deploy_gr00t_n1d7.sh, openloop_eval.sh). The image uses PYTHONPATH for both.
#
# Why this file exists instead of reusing src/gr00t's manifests: those are mutually inconsistent
# -- pyproject.toml pins transformers==4.51.3 (no Qwen3-VL, so no N1.7), while uv.lock holds
# 4.57.0 and was generated from pyproject.cu13.toml, a file nothing references. Reconciling them
# is a repo-wide change (the cuda12/cuda13 extras are a documented convention) and needs a
# baseline re-run; deliberately deferred. See guia-tecnico.md section 12.
#
# Change a pin only together with a baseline re-run, then regenerate the lock from this
# directory with `uv lock`. The image installs with `uv sync --frozen`, so a stale lock fails
# the build instead of silently resolving something else.

[project]
name = "ovx-gr00t-env"
version = "0.0.0"
requires-python = "==3.12.*"
dependencies = [
    # Proven on the OVX specialists. torch 2.13 breaks the flash-attn wheel below
    # (undefined symbol materialize_cow_storage), hence the exact pins.
    "torch==2.12.1",
    "torchvision==0.27.1",
    "transformers==4.57.0",
    "tokenizers==0.22.2",
    "torchcodec==0.16.0",
    "bitsandbytes==0.49.2",
    "wandb==0.28.2",
    "deepspeed==0.17.1",
    "flash-attn @ https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.4/flash_attn-2.8.3+cu130torch2.11-cp312-cp312-linux_x86_64.whl",

    # Base dependencies of src/gr00t/pyproject.toml, unchanged.
    "albumentations==1.4.18",
    "av==15.0.0",
    "diffusers==0.35.1",
    "dm-tree==0.1.8",
    "lmdb==1.7.5",
    "msgpack==1.1.0",
    "msgpack-numpy==0.4.8",
    "pandas==2.2.3",
    "peft==0.17.1",
    "termcolor==3.2.0",
    "tyro==0.9.17",
    # src/gr00t pins click==8.1.8, but wandb 0.28.2 needs >=8.2.0; upgrading wandb on the OVX
    # venv upgraded click with it, so this is what the specialists actually ran with.
    "click>=8.2.0",
    "datasets==3.6.0",
    "einops==0.8.1",
    "gymnasium==1.2.2",
    "matplotlib==3.10.1",
    "numpy==1.26.4",
    "omegaconf==2.3.0",
    "scipy==1.15.3",
    "pyzmq==27.0.1",

    # Policy server (gr00t/deploy/gr00t_serve_simple.py).
    "fastapi",
    "uvicorn",
    "python-dotenv",
]

[tool.uv]
package = false
# The flash-attn wheel only exists for linux x86_64 / cp312; lock for that platform alone.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

# deepspeed ships only an sdist whose setup.py imports torch.
[tool.uv.extra-build-dependencies]
deepspeed = [{ requirement = "torch", match-runtime = true }]
