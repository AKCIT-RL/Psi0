# configs/wla/unitree_wbt_shelf.yaml
# F1 — baseline UnifoLM-WLA: apenas UnifoLM_WBT_Dataset (G1_WBT_Brainco_Supermarket_Shelf_Organizing, 200 ep, 30 FPS).
# Derivado de third_party/unifolm-wla/unifolm_wla/dataloader/multi_source_dataset/configs/unitree.yaml
# (cópia própria — o submódulo não é editado).
target_fps: 30
chunk_size: 30  # 1 second at 30 FPS
image_size: [336, 448]
norm_type: "minmax_q"
rel_norm_type: "zscore"
state_norm_type: "minmax_q"
gripper_norm_type: "minmax_q"
data_base: "/raid/user_marcospaulo/datasets/unifolm"
cache_dir: "/raid/user_marcospaulo/cache/unifolm_arrow"

# ============================================================
# YAML anchors (top-level keys, ignored by Python loader)
# ============================================================
.unitree_base: &unitree_base
  enabled: true
  weight: 1.0
  robot_type: "unitree"
  source_fps: 30
  arm_type: "dual_with_legs"
  ee_format: "xyz_rpy"
  multi_task: true
  merge_left_right_ee_stats: true
  precollected_stats_path: "/raid/user_marcospaulo/Psi0/third_party/unifolm-wla/unifolm_wla/dataloader/multi_source_dataset/stats"
  action_keys:
    left_ee_pose: "action.left_ee_pose_gripper_base"
    right_ee_pose: "action.right_ee_pose_gripper_base"
    left_gripper: "action.left_gripper"
    right_gripper: "action.right_gripper"
    waist_joint: "action.waist_action_joint"
    base_command: "action.base_command"
    left_leg: "action.left_leg"
    right_leg: "action.right_leg"
  state_keys:
    left_ee_pose: "observation.state.left_ee_pose_gripper_base"
    right_ee_pose: "observation.state.right_ee_pose_gripper_base"
    left_gripper: "observation.state.left_gripper"
    right_gripper: "observation.state.right_gripper"
    waist_joint: "observation.state.waist_state_joint"
    left_leg: "observation.state.left_leg"
    right_leg: "observation.state.right_leg"
  relative_stats_key_map:
    left_ee_pose: "left_ee_pose_gripper_base"
    right_ee_pose: "right_ee_pose_gripper_base"
  base_command_dims:
    vx: 0
    vy: 1
    vw: 2
    height: 3

.unitree_fullbody_base: &unitree_fullbody_base
  enabled: true
  weight: 1.0
  robot_type: "unitree"
  source_fps: 30
  arm_type: "dual_with_legs"
  ee_format: "xyz_rpy"
  multi_task: true
  merge_left_right_ee_stats: true
  precollected_stats_path: "/raid/user_marcospaulo/Psi0/third_party/unifolm-wla/unifolm_wla/dataloader/multi_source_dataset/stats"
  action_keys:
    left_ee_pose: "action.left_ee_pose_gripper_base"
    right_ee_pose: "action.right_ee_pose_gripper_base"
    left_fig6d: "action.left_fig6d"
    right_fig6d: "action.right_fig6d"
    waist_joint: "action.waist_action_joint"
    base_command: "action.base_command"
    left_leg: "action.left_leg"
    right_leg: "action.right_leg"
    base_pose: "action.action_base_pose"
  state_keys:
    left_ee_pose: "observation.state.left_ee_pose_gripper_base"
    right_ee_pose: "observation.state.right_ee_pose_gripper_base"
    left_fig6d: "observation.state.left_fig6d"
    right_fig6d: "observation.state.right_fig6d"
    waist_joint: "observation.state.waist_state_joint"
    left_leg: "observation.state.left_leg"
    right_leg: "observation.state.right_leg"
    base_pose: "observation.state.state_base_pose"
    base_rot: "observation.state.state_base_rot"

  relative_stats_key_map:
    left_ee_pose: "left_ee_pose_gripper_base"
    right_ee_pose: "right_ee_pose_gripper_base"
    base_pose: "action_base_pose"
  base_command_dims:
    vx: 0
    vy: 1
    vw: 2
    height: 3

.unitree_img_with_stereo: &unitree_img_with_stereo
  - key: "observation.images.head_stereo_left_rec"
    role: "head_left"
  - key: "observation.images.wrist_left"
    role: "cam_wrist_left"
  - key: "observation.images.wrist_right"
    role: "cam_wrist_right"

.unitree_img_wo_stereo: &unitree_img_wo_stereo
  - key: "observation.images.head_stereo_left"
    role: "head_left"
  - key: "observation.images.wrist_left"
    role: "cam_wrist_left"
  - key: "observation.images.wrist_right"
    role: "cam_wrist_right"

image_roles:
  - "head_left"
  - "cam_wrist_left"
  - "cam_wrist_right"

datasets:

  # Único dataset habilitado: WBT Shelf Organizing (200 episódios).
  - <<: *unitree_fullbody_base
    name: "UnifoLM_WBT_Dataset"
    data_path: "UnifoLM_WBT_Dataset/"
    image_keys: *unitree_img_wo_stereo
